aid: comparaonline
name: ComparaOnline
description: >-
  ComparaOnline is a Latin American digital marketplace and licensed insurance
  broker that lets consumers compare and buy insurance and financial products in
  one place. Operating in Chile (comparaonline.cl), Brazil (comparaonline.com.br)
  and Colombia (comparaonline.com.co), it aggregates offers for auto insurance,
  mandatory SOAP accident insurance, travel, life, health and pet insurance
  alongside financial products such as mortgage, auto and consumer loans, credit
  cards and checking accounts. Its Chilean brokerage, Compara Online Corredora de
  Seguros SpA, is supervised by the Comision para el Mercado Financiero (CMF), and
  the company earns revenue as a broker collecting premiums and by referring users
  to partner banks and insurers. ComparaOnline is a fintech/insurtech portfolio
  company of Ribbit Capital. No public developer API or specification is currently
  published; this profile captures the company's public identity and web surface.
